<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J'ai une surprise pour toi...</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030106;
            --rose-gold: #ffb7c5;
            --deep-red: #ff3366;
            --gold: #ffd700;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Playfair Display', serif;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px;
            transition: opacity 1.2s ease, transform 1.2s ease;
        }

        .container.hidden {
            opacity: 0;
            transform: scale(0.85);
            pointer-events: none;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 4.5rem;
            color: var(--rose-gold);
            text-shadow: 0 0 20px rgba(255, 183, 197, 0.5), 0 0 40px rgba(255, 51, 102, 0.3);
            margin-bottom: 35px;
            animation: floatText 4s ease-in-out infinite alternate;
        }

        @keyframes floatText {
            0% { transform: translateY(0); }
            100% { transform: translateY(-12px); }
        }

        .btn-surprise {
            background: linear-gradient(135deg, #2a0815, #5a122d);
            color: var(--rose-gold);
            border: 2px solid rgba(255, 183, 197, 0.5);
            padding: 20px 55px;
            font-size: 1.4rem;
            font-family: 'Playfair Display', serif;
            letter-spacing: 3px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 25px rgba(255, 51, 102, 0.3);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-surprise:hover {
            background: linear-gradient(135deg, #4a1529, #7a193c);
            border-color: var(--rose-gold);
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9), 0 0 35px rgba(255, 183, 197, 0.5);
        }

        .btn-surprise:active {
            transform: translateY(1px) scale(0.98);
        }

        .final-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            z-index: 20;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 2s ease, transform 2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 100%;
            padding: 0 20px;
        }

        .final-message.visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .final-message h2 {
            font-family: 'Great Vibes', cursive;
            font-size: 6rem;
            color: #ffffff;
            text-shadow: 0 0 20px #ff3366, 0 0 40px #ff3366, 0 0 80px #ffb7c5, 0 0 120px #ffd700;
            letter-spacing: 2px;
            line-height: 1.2;
        }

        .sub-hint {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.35);
            font-size: 0.85rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="container" id="welcome-box">
        <h1>J'ai une surprise pour toi</h1>
        <button class="btn-surprise" id="trigger-btn">Découvrir</button>
    </div>

    <div class="final-message" id="final-box">
        <h2>Je t'aime mon amour</h2>
    </div>

    <div class="sub-hint">Clique n'importe où pour déclencher une explosion</div>

    <canvas id="fireworksCanvas"></canvas>

    <script>
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        let rockets = [];
        let stars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function initStars() {
            stars = [];
            for (let i = 0; i < 200; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.5,
                    alpha: Math.random() * 0.7 + 0.3,
                    twinkleSpeed: Math.random() * 0.02 + 0.005
                });
            }
        }
        initStars();

        class Rocket {
            constructor(targetX, targetY, color, type = 'sphere', customCallback = null) {
                this.x = canvas.width / 2 + (Math.random() * 400 - 200);
                this.y = canvas.height;
                this.targetX = targetX;
                this.targetY = targetY;
                this.color = color;
                this.speed = 7 + Math.random() * 3;
                this.angle = Math.atan2(targetY - this.y, targetX - this.x);
                this.type = type;
                this.customCallback = customCallback;
                
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Émission de petite traînée d'étincelles pendant la montée
                if (Math.random() < 0.6) {
                    particles.push(new TrailParticle(this.x, this.y, this.color));
                }

                if (this.y <= this.targetY) {
                    this.explode();
                    return true;
                }
                return false;
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }

            explode() {
                if (this.customCallback) {
                    this.customCallback();
                } else if (this.type === 'heart') {
                    createHeartExplosion(this.targetX, this.targetY, this.color);
                } else if (this.type === 'ring') {
                    createRingExplosion(this.targetX, this.targetY, this.color);
                } else if (this.type === 'willow') {
                    createWillowExplosion(this.targetX, this.targetY, this.color);
                } else {
                    createSpectacularExplosion(this.targetX, this.targetY, this.color);
                }
            }
        }

        class TrailParticle {
            constructor(x, y, color) {
                this.x = x + (Math.random() * 4 - 2);
                this.y = y + (Math.random() * 4 - 2);
                this.color = color;
                this.alpha = 0.8;
                this.decay = Math.random() * 0.04 + 0.03;
                this.size = Math.random() * 1.5 + 1;
            }

            update() {
                this.y += 0.5;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(this.alpha, 0);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color, options = {}) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.alpha = 1;
                this.friction = options.friction || 0.96;
                this.gravity = options.gravity || 0.04;
                this.size = options.size || (Math.random() * 2 + 1.5);
                this.flicker = options.flicker || false;

                if (options.vx !== undefined && options.vy !== undefined) {
                    this.vx = options.vx;
                    this.vy = options.vy;
                } else {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = options.speed || (Math.random() * 9 + 2);
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                }

                this.decay = options.decay || (Math.random() * 0.01 + 0.006);
            }

            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;

                if (this.flicker && Math.random() < 0.2) {
                    this.alpha = Math.min(1, this.alpha + 0.2);
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(this.alpha, 0);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        // Explosion sphérique massive et lumineuse
        function createSpectacularExplosion(x, y, color) {
            const count = 220;
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color, {
                    speed: Math.random() * 10 + 2,
                    flicker: true,
                    decay: Math.random() * 0.009 + 0.005
                }));
            }
            // Flash au centre
            for (let i = 0; i < 20; i++) {
                particles.push(new Particle(x, y, '#ffffff', {
                    speed: Math.random() * 3 + 1,
                    size: 3,
                    decay: 0.03
                }));
            }
        }

        // Explosion en forme de cœur dense
        function createHeartExplosion(x, y, color) {
            const count = 250;
            for (let i = 0; i < count; i++) {
                const t = Math.random() * Math.PI * 2;
                const hX = 16 * Math.pow(Math.sin(t), 3);
                const hY = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                const scale = Math.random() * 0.4 + 1.2;
                particles.push(new Particle(x, y, color, {
                    vx: hX * 0.14 * scale,
                    vy: hY * 0.14 * scale,
                    size: 2.2,
                    decay: Math.random() * 0.006 + 0.004,
                    flicker: true
                }));
            }
        }

        // Explosion en anneau (effet onde de choc)
        function createRingExplosion(x, y, color) {
            const count = 120;
            const speed = 7;
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2;
                particles.push(new Particle(x, y, color, {
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    decay: 0.008,
                    size: 2
                }));
            }
        }

        // Explosion effet "saule pleureur" (retombée longue et dorée)
        function createWillowExplosion(x, y, color) {
            const count = 180;
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 1;
                particles.push(new Particle(x, y, color, {
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    gravity: 0.08,
                    friction: 0.97,
                    decay: 0.004,
                    size: 1.8,
                    flicker: true
                }));
            }
        }

        // Séquence pyrotechnique spectaculaire longue (~18-20 secondes)
        function launchGrandSpectacle() {
            const w = canvas.width;
            const h = canvas.height;

            const sequence = [
                // Vague 1 : Ouverture majestueuse
                { time: 200,   x: w * 0.5,  y: h * 0.3,  color: '#ffd700', type: 'willow' },
                { time: 800,   x: w * 0.3,  y: h * 0.35, color: '#ff3366', type: 'sphere' },
                { time: 1200,  x: w * 0.7,  y: h * 0.35, color: '#ffb7c5', type: 'sphere' },

                // Vague 2 : Premiers cœurs et anneaux
                { time: 2200,  x: w * 0.5,  y: h * 0.25, color: '#ff1493', type: 'heart' },
                { time: 3000,  x: w * 0.2,  y: h * 0.4,  color: '#00ffff', type: 'ring' },
                { time: 3400,  x: w * 0.8,  y: h * 0.4,  color: '#da70d6', type: 'ring' },

                // Vague 3 : Pluie dorée croisée
                { time: 4500,  x: w * 0.35, y: h * 0.2,  color: '#ffd700', type: 'willow' },
                { time: 4800,  x: w * 0.65, y: h * 0.2,  color: '#ffd700', type: 'willow' },

                // Vague 4 : Double cœur géant
                { time: 6000,  x: w * 0.35, y: h * 0.3,  color: '#ff3366', type: 'heart' },
                { time: 6400,  x: w * 0.65, y: h * 0.3,  color: '#ffb7c5', type: 'heart' },

                // Vague 5 : Accélération rythmique
                { time: 7800,  x: w * 0.15, y: h * 0.45, color: '#ff69b4', type: 'sphere' },
                { time: 8200,  x: w * 0.85, y: h * 0.45, color: '#ffffff', type: 'sphere' },
                { time: 8600,  x: w * 0.5,  y: h * 0.2,  color: '#ffd700', type: 'ring' },

                // Vague 6 : Éclats multiples simultanés
                { time: 9800,  x: w * 0.25, y: h * 0.3,  color: '#ff3366', type: 'sphere' },
                { time: 10000, x: w * 0.5,  y: h * 0.35, color: '#ff1493', type: 'heart' },
                { time: 10200, x: w * 0.75, y: h * 0.3,  color: '#da70d6', type: 'sphere' },

                // Vague 7 : Cascade féerique
                { time: 11800, x: w * 0.3,  y: h * 0.25, color: '#ffd700', type: 'willow' },
                { time: 12200, x: w * 0.5,  y: h * 0.2,  color: '#ffffff', type: 'willow' },
                { time: 12600, x: w * 0.7,  y: h * 0.25, color: '#ffd700', type: 'willow' },

                // Vague 8 : Pré-bouquet apothéose
                { time: 14000, x: w * 0.2,  y: h * 0.35, color: '#ff3366', type: 'heart' },
                { time: 14300, x: w * 0.5,  y: h * 0.3,  color: '#ffb7c5', type: 'heart' },
                { time: 14600, x: w * 0.8,  y: h * 0.35, color: '#ff3366', type: 'heart' }
            ];

            sequence.forEach(item => {
                setTimeout(() => {
                    rockets.push(new Rocket(item.x, item.y, item.color, item.type));
                }, item.time);
            });

            // BOUQUET FINAL APOTHÉOSE (~17.5 secondes)
            setTimeout(() => {
                // Tirs d'encadrement
                rockets.push(new Rocket(w * 0.2, h * 0.25, '#ffd700', 'willow'));
                rockets.push(new Rocket(w * 0.8, h * 0.25, '#ffd700', 'willow'));
                
                setTimeout(() => {
                    // Explosion centrale maîtresse
                    rockets.push(new Rocket(w * 0.5, h * 0.2, '#ffffff', 'heart', () => {
                        createHeartExplosion(w * 0.5, h * 0.2, '#ff3366');
                        createHeartExplosion(w * 0.5, h * 0.2, '#ffd700');
                        createHeartExplosion(w * 0.5, h * 0.2, '#ffb7c5');
                        createRingExplosion(w * 0.5, h * 0.2, '#ffffff');

                        // Apparition magistrale du message final
                        setTimeout(() => {
                            document.getElementById('final-box').classList.add('visible');
                        }, 1000);
                    }));
                }, 600);
            }, 17000);
        }

        document.getElementById('trigger-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('welcome-box').classList.add('hidden');
            launchGrandSpectacle();
        });

        // Tirs manuels illimités au clic sur l'écran
        window.addEventListener('click', (e) => {
            const welcomeBox = document.getElementById('welcome-box');
            if (!welcomeBox.classList.contains('hidden')) return;

            const colors = ['#ff3366', '#ffb7c5', '#ffd700', '#ff69b4', '#ffffff', '#da70d6', '#00ffff'];
            const types = ['sphere', 'heart', 'ring', 'willow'];
            
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            const randomType = types[Math.floor(Math.random() * types.length)];
            
            rockets.push(new Rocket(e.clientX, e.clientY, randomColor, randomType));
        });

        function animate() {
            ctx.fillStyle = 'rgba(3, 1, 6, 0.25)'; // Fondu fluide pour traînées lumineuses
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                star.alpha += star.twinkleSpeed;
                if (star.alpha > 1 || star.alpha < 0.2) {
                    star.twinkleSpeed = -star.twinkleSpeed;
                }
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            for (let i = rockets.length - 1; i >= 0; i--) {
                rockets[i].draw();
                if (rockets[i].update()) {
                    rockets.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
